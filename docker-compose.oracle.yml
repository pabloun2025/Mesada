# Mesada en la VM de Oracle compartida con consulares y TEINVITO.
# - Proyecto propio «mesada-prod»: no comparte contenedores, volúmenes ni base de datos con nadie.
# - Se une a la red de consulares (citas-prod_interna) SOLO con el contenedor de la app, con alias propio,
#   para que el túnel de Cloudflare le llegue y para hablar con Evolution API. PostgreSQL queda en su red interna.
# - Sin puertos publicados en el servidor: la entrada es el túnel (mesada.veryfacil.org → http://mesada-app:3000).
# Despliegue: deploy/deploy-oracle.sh (lo lanza .github/workflows/oracle-deploy.yml).
name: mesada-prod

x-logs: &logs
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  db:
    image: postgres:16.9-alpine
    restart: unless-stopped
    logging: *logs
    environment:
      POSTGRES_DB: mesada
      POSTGRES_USER: mesada
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}
    volumes: [mesada_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesada -d mesada"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    networks: [interna]

  app:
    build: .
    image: mesada:local
    restart: unless-stopped
    logging: *logs
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://mesada:${POSTGRES_PASSWORD}@db:5432/mesada
      # Evolution API de consulares, por la red compartida.
      EVOLUTION_API_URL: http://evolution-api:8080
      # Solo para que la administración vea cuándo fue la última copia (lectura).
      BACKUP_DIR: /backups
    volumes: [mesada_uploads:/data/uploads, ./backups:/backups:ro]
    depends_on:
      db: {condition: service_healthy}
    mem_limit: 512m
    networks:
      interna: {}
      compartida:
        aliases: [mesada-app]

  backup:
    image: postgres:16.9-alpine
    restart: unless-stopped
    logging: *logs
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: mesada
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: mesada
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: 86400
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - mesada_uploads:/data/uploads:ro
    depends_on:
      db: {condition: service_healthy}
    networks: [interna]

volumes:
  mesada_pgdata:
  mesada_uploads:

networks:
  interna:
  compartida:
    external: true
    name: citas-prod_interna

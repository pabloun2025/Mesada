# Mesada autoalojada: base de datos, aplicación y copias de seguridad diarias.
# Uso: cp .env.example .env && (edita .env) && docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mesada
      POSTGRES_USER: mesada
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesada -d mesada"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: mesada:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mesada:${POSTGRES_PASSWORD}@db:5432/mesada
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      # Cifra los secretos de la verificación en dos pasos de la administración. Obligatoria.
      SECRET_KEY: ${SECRET_KEY:?Falta SECRET_KEY (openssl rand -hex 32)}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - uploads:/data/uploads
    ports:
      - "${MESADA_PORT:-8080}:3000"

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: mesada
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: mesada
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      # Copia externa cifrada en Cloudflare R2 (opcional; vacío = desactivada). Ver docs/despliegue.md §0.b.
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      R2_RETENTION_DAYS: ${R2_RETENTION_DAYS:-30}
    volumes:
      - ./backups:/backups
      - uploads:/data/uploads:ro
      - ./deploy/backup.sh:/backup.sh:ro
      - ./deploy/r2.sh:/r2.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]

volumes:
  db-data:
  uploads:

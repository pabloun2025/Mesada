<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retirar · Lucía</title><style>
@font-face{font-family:'Bricolage Grotesque Variable';src:url('fonts/bricolage-grotesque-latin-wght-normal.woff2') format('woff2-variations');font-weight:200 800;font-display:swap}
@font-face{font-family:'Mesada Digits';src:url('fonts/bricolage-grotesque-latin-wght-normal.woff2') format('woff2-variations');font-weight:200 800;unicode-range:U+0030-0039;font-display:swap}
@font-face{font-family:'Atkinson Hyperlegible';src:url('fonts/atkinson-hyperlegible-latin-400-normal.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Atkinson Hyperlegible';src:url('fonts/atkinson-hyperlegible-latin-700-normal.woff2') format('woff2');font-weight:700;font-display:swap}
:root{--ink:#142a5c;--ink2:#3b4b70;--ink3:#64738f;--paper:#f3f6fb;--card:#fff;--line:#e3e8f2;--chip:#edf1f8;
--brand:#1d5fae;--brand-deep:#123f7e;--brand-soft:#e5eefa;--leaf:#1e9e6a;--leaf-deep:#137a50;--leaf-soft:#e3f6ec;
--berry:#d6336c;--berry-soft:#fde8ef;--sun:#ffb800;--sun-deep:#e3a200;--sun-soft:#fff3cc;--sun-ink:#6e4a00;--sky:#4f8df7;--sky-soft:#e8f0ff;
--r-tile:.875rem;--r-card:1.25rem;--r-panel:1.75rem;--shadow:0 1px 0 rgb(23 42 84/.04),0 8px 24px -12px rgb(23 42 84/.18);
--display:'Bricolage Grotesque Variable',ui-sans-serif,system-ui,sans-serif;--sans:'Mesada Digits','Atkinson Hyperlegible',ui-sans-serif,system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:.5rem}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ic{flex:none}
.mvi{width:40px;height:40px;border-radius:99px;display:flex;align-items:center;justify-content:center;flex:none}.mvi.brand{background:var(--brand-soft);color:var(--brand)}.mvi.sun{background:var(--sun-soft);color:var(--sun-ink)}.mvi.berry{background:var(--berry-soft);color:#a8214f}.mvi.sky{background:var(--sky-soft);color:#2a5fc2}.mvi.leaf{background:var(--leaf-soft);color:var(--leaf-deep)}.mvi.chip{background:var(--chip);color:var(--ink2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card)}
.chip{display:inline-flex;align-items:center;gap:.25rem;border-radius:99px;padding:.15rem .6rem;font-size:12px;font-weight:700;background:var(--chip);color:var(--ink2)}
.chip.leaf{background:var(--leaf-soft);color:var(--leaf-deep)}
.chip.sun{background:var(--sun-soft);color:var(--sun-ink)}
.chip.brand{background:var(--brand-soft);color:var(--brand-deep)}
.avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:99px;font-size:1.2rem;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;white-space:nowrap;border-radius:99px;font-weight:700;height:2.75rem;padding:0 1.25rem;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--sun);color:var(--ink);box-shadow:0 6px 16px -8px rgb(227 162 0/.9)}
.btn.sec{background:var(--chip);color:var(--ink)}
.btn.ok{background:var(--leaf);color:#fff}
.btn.bad{background:var(--berry-soft);color:#a8214f}
.btn.lg{height:3.5rem;font-size:1.1rem;width:100%}
.btn.sm{height:2.25rem;padding:0 .9rem;font-size:14px}
.phone{width:100%;max-width:375px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);position:relative}
@media(min-width:420px){body{background:#dfe5f0}.phone{box-shadow:0 0 0 1px var(--line),0 20px 60px -20px rgb(20 42 92/.35)}}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.topbar img{height:30px;width:auto;display:block}
.tb-right{display:flex;align-items:center;gap:10px}
.iconbtn{width:40px;height:40px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);position:relative}
.dot-badge{position:absolute;top:2px;right:0;background:var(--sun);color:var(--ink);border-radius:99px;font-size:11px;font-weight:700;padding:0 5px;line-height:16px}
.bottomnav{position:sticky;bottom:0;margin-top:auto;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:rgb(255 255 255/.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bottomnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;font-size:11px;font-weight:700;color:var(--ink3);text-decoration:none}
.bottomnav a span.pill{display:flex;height:32px;width:56px;align-items:center;justify-content:center;border-radius:99px}
.bottomnav a.on{color:var(--brand)}
.bottomnav a.on span.pill{background:var(--brand-soft)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

body{overflow-x:hidden}
.phone{height:812px;min-height:0;max-height:812px;overflow:hidden}
.bgmock{filter:saturate(.8);pointer-events:none;user-select:none}
.bgmock .hello{padding:18px 16px 4px}
.bgmock h1{font-size:28px}
.bgmock .mini{margin:12px 16px;height:150px;border-radius:28px;background:linear-gradient(150deg,#2a70c4,#123f7e 78%,#142a5c)}
.scrim{position:absolute;inset:0;background:rgb(20 42 92/.55);backdrop-filter:blur(2px)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:28px 28px 0 0;padding:10px 16px 20px;box-shadow:0 -20px 50px -20px rgb(20 42 92/.5);animation:up .35s cubic-bezier(.2,.9,.3,1.05)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:99px;background:#d3dbea;margin:0 auto 10px}
.sh-h{display:flex;align-items:center;justify-content:space-between}
.sh-h h2{font-size:20px}
.sh-h p{font-size:13.5px;color:var(--ink2)}
.sh-h p b{color:var(--ink)}
.amount{text-align:center;padding:14px 0 4px}
.amount .v{font-size:60px;font-weight:800;line-height:1;display:inline-flex;align-items:baseline;gap:6px}
.amount .v small{font-size:30px;font-weight:700;color:var(--ink3)}
.ghost{color:#b6c1d6}.amount .v{gap:0}.amount .v small{margin-left:8px}.caret{display:inline-block;width:3px;height:48px;background:var(--brand);border-radius:2px;align-self:center;margin-left:2px;animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.amount .after{font-size:13.5px;color:var(--ink2);margin-top:6px}
.chips{display:flex;justify-content:center;gap:8px;margin:10px 0 8px}
.chips button{height:40px;padding:0 18px;border-radius:99px;background:var(--chip);font-weight:700;font-size:15px;color:var(--ink);border:1.5px solid transparent;font-family:var(--display)}
.chips button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-deep)}
.info{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;color:var(--ink2);padding:6px 0 10px}
.info .pips{display:flex;gap:4px}.info .pips i{width:18px;height:6px;border-radius:99px;background:var(--brand)}.info .pips i+i{background:#c3cde0}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 10px;margin-bottom:12px}
.key{height:56px;border-radius:16px;font-family:var(--display);font-size:26px;font-weight:600;background:var(--paper);display:flex;align-items:center;justify-content:center;transition:background .1s,transform .1s}
.key:active{background:var(--brand-soft);transform:scale(.96)}
.key.alt{background:transparent;color:var(--ink2)}
</style></head><body><div class="phone">
<div class="bgmock" aria-hidden="true"><header class="topbar"><img src="assets/logo.png" alt=""><span class="avatar" style="width:38px;height:38px;background:#FFE3D1">🦊</span></header><div class="hello"><h1>Mi banco</h1></div><div class="mini"></div></div>
<div class="scrim"></div>
<section class="sheet" role="dialog" aria-label="Retirar dinero">
  <div class="grab"></div>
  <div class="sh-h"><div><h2>Retirar dinero</h2><p>Disponible: <b class="num">17,50 €</b></p></div><button class="iconbtn" style="background:var(--chip)" aria-label="Cerrar"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
  <div class="amount"><div class="v num"><span id="v">10</span><span id="gh" class="ghost">,00</span><span class="caret"></span><small>€</small></div><div class="after" id="after"></div></div>
  <div class="chips" role="group" aria-label="Importes rápidos"><button data-v="5">5 €</button><button data-v="10" class="on">10 €</button><button data-v="17.5">Todo</button></div>
  <div class="info"><span class="pips" aria-hidden="true"><i></i><i></i></span>Retiros esta semana: <b>1 de 2</b></div>
  <div class="keys"><button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button><button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button><button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button><button class="key alt" data-k="," aria-label="Coma">,</button><button class="key" data-k="0">0</button><button class="key alt" data-k="del" aria-label="Borrar"><svg class="ic" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m12 9 6 6"/><path d="m18 9-6 6"/></svg></button></div>
  <button class="btn primary lg" id="go">Retirar 10,00 €</button>
</section></div><script>
let raw='10',max=17.5;
const v=document.getElementById('v'),btn=document.getElementById('go'),after=document.getElementById('after');
const fmt=n=>n.toFixed(2).replace('.',',');
function render(){
  const parts=raw.split(','); const shown=raw===''?'0':raw;
  const n=parseFloat(shown.replace(',','.'))||0;
  v.textContent=shown;{const p=shown.split(',');document.getElementById('gh').textContent=p.length===1?',00':(p[1].length===0?'00':(p[1].length===1?'0':''));}
  btn.textContent='Retirar '+fmt(n)+' €'; btn.disabled=n<=0||n>max;
  after.textContent=n>max?'Te pasas de tu saldo':'Te quedarán '+fmt(Math.max(0,max-n))+' €';
  document.querySelectorAll('.chips button').forEach(b=>b.classList.toggle('on',parseFloat(b.dataset.v)===n));
}
document.querySelectorAll('[data-k]').forEach(k=>k.addEventListener('click',()=>{
  const c=k.dataset.k;
  if(c==='del')raw=raw.slice(0,-1);
  else if(c===','){if(!raw.includes(','))raw=(raw||'0')+',';}
  else{ if(raw==='0')raw=c; else if(!raw.includes(',')||raw.split(',')[1].length<2)raw+=c; }
  render();
}));
document.querySelectorAll('.chips button').forEach(b=>b.addEventListener('click',()=>{raw=String(b.dataset.v).replace('.',',');render();}));
render();
</script></body></html>
